[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "voltran-ai"
version = "0.1.0"
description = "Yerel ve denetlenebilir çoklu LLM orkestrasyonu"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "VOLTRAN contributors" }]
dependencies = [
  "pydantic>=2.8,<3",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pyright>=1.1,<2",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
]

[project.scripts]
voltran = "voltran.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/voltran"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
